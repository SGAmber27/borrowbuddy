<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Borrow Buddy | Admin Profile</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
  min-height: 100vh;
}

.admin-profile-container {
  max-width: 1050px;
  margin: 30px auto;
  padding: 20px;
}

/* HEADER */
.header-nav {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  margin-bottom: 25px;
  gap: 15px;
}

.nav-center h1 {
  text-align: center;
  color: #ff6b6b;
  font-size: 26px;
}

.btn-back, .logout-btn {
  padding: 10px 18px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-back {
  background: #007bff;
  color: white;
}

.logout-btn {
  background: #dc3545;
  color: white;
}

/* PROFILE HEADER */
.profile-header {
  display: flex;
  align-items: center;
  gap: 25px;
  padding: 30px;
  background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
  border-radius: 18px;
  color: white;
  margin-bottom: 30px;
}

.profile-avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: rgba(255,255,255,0.25);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 48px;
}

.profile-info h2 {
  font-size: 28px;
}

/* TABS */
.profile-tabs {
  display: flex;
  background: white;
  border-radius: 12px;
  overflow: hidden;
  margin-bottom: 25px;
}

.profile-tab {
  flex: 1;
  padding: 12px;
  border: none;
  cursor: pointer;
  font-weight: 600;
  color: #666;
}

.profile-tab.active {
  background: linear-gradient(135deg, #ff6b6b, #ee5a6f);
  color: white;
}

/* SECTIONS */
.profile-section { display: none; }
.profile-section.active { display: block; }

/* CARD */
.profile-card {
  background: white;
  padding: 25px;
  border-radius: 14px;
  margin-bottom: 25px;
  box-shadow: 0 6px 18px rgba(0,0,0,0.08);
}

.profile-card h3 {
  margin-bottom: 15px;
}

/* INFO GRID */
.info-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 15px;
}

.info-item {
  padding: 15px;
  background: #f8f9fa;
  border-radius: 8px;
  border-left: 4px solid #ff6b6b;
}

.info-label {
  font-size: 12px;
  color: #999;
}

.info-value {
  font-size: 18px;
  font-weight: 600;
}

/* STATS */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
}

.stat-card {
  background: linear-gradient(135deg, #667eea, #764ba2);
  color: white;
  padding: 20px;
  border-radius: 12px;
}

.stat-card i {
  font-size: 28px;
  margin-bottom: 10px;
}

.stat-card h2 {
  font-size: 30px;
}

/* FORM */
.edit-form label {
  font-weight: 600;
  display: block;
  margin-top: 15px;
}

.edit-form input {
  width: 100%;
  padding: 10px;
  margin-top: 5px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

.save-btn {
  margin-top: 20px;
  padding: 12px;
  background: #28a745;
  color: white;
  border: none;
  border-radius: 6px;
  font-weight: 600;
  cursor: pointer;
}

@media (max-width: 768px) {
  .header-nav {
    grid-template-columns: 1fr;
    text-align: center;
  }
  .profile-header {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<div class="admin-profile-container">

  <!-- HEADER -->
  <div class="header-nav">
    <button class="btn-back" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back</button>
    <div class="nav-center"><h1>Admin Profile</h1></div>
    <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <!-- PROFILE HEADER -->
  <div class="profile-header">
    <div class="profile-avatar"><i class="fas fa-user-shield"></i></div>
    <div class="profile-info">
      <h2 id="displayName"></h2>
      <p id="displayEmail"></p>
    </div>
  </div>

  <!-- TABS -->
  <div class="profile-tabs">
    <button class="profile-tab active" onclick="switchTab('overview', this)">Overview</button>
    <button class="profile-tab" onclick="switchTab('stats', this)">Stats</button>
    <button class="profile-tab" onclick="switchTab('edit', this)">Edit</button>
  </div>

  <!-- OVERVIEW -->
  <div id="overview" class="profile-section active">
    <div class="profile-card">
      <h3>Account Info</h3>
      <div class="info-grid" id="accountInfo"></div>
    </div>
  </div>

  <!-- STATS -->
  <div id="stats" class="profile-section">
    <div class="profile-card">
      <h3>System Statistics</h3>
      <div class="stats-grid" id="statsGrid"></div>
    </div>
  </div>

  <!-- EDIT -->
  <div id="edit" class="profile-section">
    <div class="profile-card">
      <h3>Edit Profile</h3>
      <form class="edit-form" onsubmit="saveProfile(event)">
        <label>First Name</label>
        <input type="text" id="editFirst">

        <label>Last Name</label>
        <input type="text" id="editLast">

        <label>Email</label>
        <input type="email" id="editEmail">

        <button class="save-btn">Save Changes</button>
      </form>
    </div>
  </div>

</div>

<script>
let currentUser = JSON.parse(localStorage.getItem("loggedInUser")) || {
  firstName: "Administrator",
  lastName: "",
  email: "admin@borrowbuddy.local",
  username: "admin"
};

function loadProfile() {
  displayName.textContent = currentUser.firstName + " " + currentUser.lastName;
  displayEmail.textContent = currentUser.email;

  accountInfo.innerHTML = `
    <div class="info-item">
      <div class="info-label">Username</div>
      <div class="info-value">${currentUser.username}</div>
    </div>
    <div class="info-item">
      <div class="info-label">Email</div>
      <div class="info-value">${currentUser.email}</div>
    </div>
  `;

  editFirst.value = currentUser.firstName;
  editLast.value = currentUser.lastName;
  editEmail.value = currentUser.email;

  loadStats();
}

function loadStats() {
  const items = JSON.parse(localStorage.getItem("items")) || [];
  const requests = JSON.parse(localStorage.getItem("requests")) || [];
  const users = JSON.parse(localStorage.getItem("users")) || [];

  const totalItems = items.length;
  const currentlyBorrowed = items.filter(item => item.status === "Not Available").length;
  const registeredUsers = users.length;
  const overdueItems = requests.filter(req =>
    req.status === "Approved" &&
    new Date(req.dueDate) < new Date()
  ).length;

  statsGrid.innerHTML = `
    <div class="stat-card">
      <i class="fas fa-book"></i>
      <h2>${totalItems}</h2>
      <p>Total Items</p>
    </div>
    <div class="stat-card">
      <i class="fas fa-hand-holding"></i>
      <h2>${currentlyBorrowed}</h2>
      <p>Currently Borrowed</p>
    </div>
    <div class="stat-card">
      <i class="fas fa-users"></i>
      <h2>${registeredUsers}</h2>
      <p>Registered Users</p>
    </div>
    <div class="stat-card">
      <i class="fas fa-clock"></i>
      <h2>${overdueItems}</h2>
      <p>Overdue Items</p>
    </div>
  `;
}

function saveProfile(e) {
  e.preventDefault();
  currentUser.firstName = editFirst.value;
  currentUser.lastName = editLast.value;
  currentUser.email = editEmail.value;

  localStorage.setItem("loggedInUser", JSON.stringify(currentUser));
  loadProfile();
  alert("Profile updated successfully!");
}

function switchTab(tabId, el) {
  document.querySelectorAll(".profile-section").forEach(s => s.classList.remove("active"));
  document.querySelectorAll(".profile-tab").forEach(t => t.classList.remove("active"));
  document.getElementById(tabId).classList.add("active");
  el.classList.add("active");

  // Load stats when switching to stats tab
  if (tabId === 'stats') {
    loadStats();
  }
}

function goBack() {
  window.location.href = "admin.html";
}

function logout() {
  localStorage.removeItem("loggedInUser");
  window.location.href = "login.html";
}

loadProfile();
</script>

</body>
</html>

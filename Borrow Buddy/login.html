<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borrow Buddy | Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
<link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>

  <div class="login-card">
    <div class="role-toggle">
      <button id="studentBtn" class="active"><i class="fas fa-user"></i> Student</button>
      <button id="adminBtn"><i class="fas fa-shield-alt"></i> Admin</button>
    </div>

    <form id="loginForm">
      <label for="username">Full name or Email</label>
      <div class="input-box">
        <i class="fas fa-envelope"></i>
        <input type="text" id="username" placeholder="student@snnhs.edu.ph" required />
      </div>

      <label for="password">Password</label>
      <div class="input-box">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>

      <button type="submit" class="login-btn">
        <i class="fas fa-arrow-right-to-bracket"></i> Sign In as <span id="userType">Student</span>
      </button>
    </form>

    <p class="demo-note">Don't have an account? <a href="signup.html">Sign up</a></p>
    <p class="demo-note">Forgot password? <a href="forgot-password.html">Reset here</a></p>
  </div>

<script>
  // Mobile menu toggle function
  function toggleMobileMenu() {
    const hamburger = document.querySelector('.hamburger');
    const mobileMenu = document.getElementById('mobileMenu');
    if (hamburger && mobileMenu) {
      hamburger.classList.toggle('active');
      mobileMenu.classList.toggle('active');
    }
  }

  const studentBtn = document.getElementById("studentBtn");
  const adminBtn = document.getElementById("adminBtn");
  const userType = document.getElementById("userType");
  const form = document.getElementById("loginForm");

  // Default role
  let currentRole = "student";

  // === SLIDER BUTTONS ===
  studentBtn.addEventListener("click", () => {
    studentBtn.classList.add("active");
    adminBtn.classList.remove("active");
    currentRole = "student";
    userType.textContent = "Student";
  });

  adminBtn.addEventListener("click", () => {
    adminBtn.classList.add("active");
    studentBtn.classList.remove("active");
    currentRole = "admin";
    userType.textContent = "Admin";
  });

  // Debug function to show registered users
  window.showDebugInfo = function() {
    const users = JSON.parse(localStorage.getItem("users")) || [];
    if (users.length === 0) {
      alert("No registered users found. Please sign up first!");
      return;
    }
    let debugInfo = "📋 REGISTERED USERS:\n\n";
    users.forEach((u, i) => {
      debugInfo += `${i + 1}. Username: ${u.username}\n   Email: ${u.email}\n   Role: ${u.role}\n   Status: ${u.isActive !== false ? 'Active' : 'Disabled'}\n\n`;
    });
    alert(debugInfo);
  };

  // === LOGIN FUNCTION ===
  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    if (!username || !password) {
      alert("Please fill out all fields!");
      return;
    }

    await window.initSupabase();

    try {
      const { data, error } = await supabase.auth.signInWithPassword({
        email: username,
        password: password
      });

      if (error) {
        alert(`Login failed: ${error.message}`);
        return;
      }

      // Create/update profile
      await supabase.from('profiles').upsert({
        id: data.user.id,
        email: username,
        role: currentRole,
        firstName: data.user.email.split('@')[0], // fallback
        updated_at: new Date().toISOString()
      });

      showNotification('Login successful!', 'success');
      
      if (currentRole === "admin") {
        window.location.href = "admin.html";
      } else {
        window.location.href = "student.html";
      }
    } catch (e) {
      alert('Login error: ' + e.message);
    }
  });
</script>

</body>
</html>

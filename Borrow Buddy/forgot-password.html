<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Borrow Buddy | Forgot Password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <div class="login-card">
    <h2 style="text-align: center; margin-bottom: 20px; color: #0066cc;"> Password Recovery</h2>

    <div id="step1" class="recovery-step">
      <h3>Step 1: Identify Your Account</h3>
      <form id="identifyForm">
        <label for="recoveryEmail">Email Address</label>
        <div class="input-box">
          <i class="fas fa-envelope"></i>
          <input type="email" id="recoveryEmail" placeholder="Enter your registered email" required />
        </div>

        <button type="submit" class="login-btn">
          <i class="fas fa-search"></i> Find Account
        </button>
      </form>
    </div>

    <div id="step2" class="recovery-step" style="display: none;">
      <h3>Step 2: Reset Password</h3>
      <form id="resetForm">
        <p id="accountInfo" style="color: #666; margin-bottom: 15px;"></p>

        <label for="newPassword">New Password</label>
        <div class="input-box">
          <i class="fas fa-lock"></i>
          <input type="password" id="newPassword" placeholder="Enter new password (4+ characters)" required />
        </div>

        <label for="confirmPassword">Confirm Password</label>
        <div class="input-box">
          <i class="fas fa-lock"></i>
          <input type="password" id="confirmPassword" placeholder="Confirm your password" required />
        </div>

        <button type="submit" class="login-btn">
          <i class="fas fa-key"></i> Reset Password
        </button>
        <button type="button" onclick="resetRecoveryForm()" style="width: 100%; padding: 10px; margin-top: 10px; background: #ddd; border: none; border-radius: 6px; cursor: pointer;">
          Back
        </button>
      </form>
    </div>

    <div id="step3" class="recovery-step" style="display: none;">
      <h3>✅ Password Reset Successful!</h3>
      <p style="text-align: center; color: #28a745; margin: 20px 0;">
        Your password has been reset successfully.
      </p>
      <a href="login.html" class="login-btn" style="display: block; text-align: center; text-decoration: none;">
        <i class="fas fa-arrow-left"></i> Return to Login
      </a>
    </div>

    <hr style="margin: 20px 0; border: none; border-top: 1px solid #ddd;">
    <p style="text-align: center; margin-top: 20px;">
      <a href="login.html" style="color: #0066cc; text-decoration: none;">← Back to Login</a>
    </p>
  </div>

  <script>
  const identifyForm = document.getElementById("identifyForm");
  const resetForm = document.getElementById("resetForm");
  let recoveredUser = null;

  // Identify user account
  identifyForm.addEventListener("submit", (e) => {
    e.preventDefault();

    const email = document.getElementById("recoveryEmail").value.trim();

    const users = JSON.parse(localStorage.getItem("users")) || [];

    // Find user by email
    const user = users.find(u => u.email.toLowerCase() === email.toLowerCase());

    if (!user) {
      alert("❌ Email not found in our system. Please check and try again.");
      return;
    }

    // User identified successfully - email verification is sufficient for demo
    recoveredUser = user;
    document.getElementById("step1").style.display = "none";
    document.getElementById("step2").style.display = "block";
    document.getElementById("accountInfo").textContent = `Account found: ${user.username} (${user.email})`;
  });

  // Reset password
  resetForm.addEventListener("submit", (e) => {
    e.preventDefault();

    const newPassword = document.getElementById("newPassword").value.trim();
    const confirmPassword = document.getElementById("confirmPassword").value.trim();

    if (newPassword.length < 4) {
      alert("❌ Password must be at least 4 characters long!");
      return;
    }

    if (newPassword !== confirmPassword) {
      alert("❌ Passwords do not match!");
      return;
    }

    // Update password in localStorage
    const users = JSON.parse(localStorage.getItem("users")) || [];
    const userIndex = users.findIndex(u => u.email === recoveredUser.email);

    if (userIndex !== -1) {
      users[userIndex].password = newPassword;
      users[userIndex].passwordChangedAt = new Date().toLocaleString();
      localStorage.setItem("users", JSON.stringify(users));

      // Show success message
      document.getElementById("step2").style.display = "none";
      document.getElementById("step3").style.display = "block";
    }
  });

  function resetRecoveryForm() {
    document.getElementById("step1").style.display = "block";
    document.getElementById("step2").style.display = "none";
    document.getElementById("step3").style.display = "none";
    identifyForm.reset();
    resetForm.reset();
    recoveredUser = null;
  }
  </script>

</body>
</html>
